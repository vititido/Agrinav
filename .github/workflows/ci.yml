name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install linters
        run: |
          pip install ruff==0.17.6 xacro
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-utils
      - name: ruff check
        run: ruff check .
      - name: ruff format
        run: ruff format --check .
      - name: xmllint package manifests
        run: |
          files=$(find src -name package.xml 2>/dev/null || true)
          if [ -z "$files" ]; then echo "No package.xml files yet."; exit 0; fi
          xmllint --noout $files
      - name: xmllint generated URDF
        if: hashFiles('src/agrinav_description/urdf/agrinav.urdf.xacro') != ''
        run: |
          xacro src/agrinav_description/urdf/agrinav.urdf.xacro > "$RUNNER_TEMP/agrinav.urdf"
          xmllint --noout "$RUNNER_TEMP/agrinav.urdf"

  build-test:
    runs-on: ubuntu-24.04
    # The ros-tooling image ships ROS and the CI tools, so the job does not
    # depend on what the hosted runner image has preinstalled. On the bare
    # runner the ROS Python modules intermittently went missing from
    # PYTHONPATH during the build, which did not reproduce in a clean
    # Ubuntu 24.04 with the same packages.
    container:
      image: rostooling/setup-ros-docker:ubuntu-noble-ros-jazzy-ros-base-latest
    steps:
      - uses: actions/checkout@v7
      - name: Report empty workspace
        if: hashFiles('src/**/package.xml') == ''
        run: echo "No ROS packages in src/ yet; nothing to build."
      - uses: ros-tooling/action-ros-ci@v0.4
        if: hashFiles('src/**/package.xml') != ''
        with:
          target-ros2-distro: jazzy
          # action-ros-ci re-clones the repository with vcs; the job token lets
          # it read a private repository.
          import-token: ${{ secrets.GITHUB_TOKEN }}
