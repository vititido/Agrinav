controller_manager:
  ros__parameters:
    update_rate: 50  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController

diff_drive_controller:
  ros__parameters:
    use_sim_time: true
    left_wheel_names: ["front_left_wheel_joint", "rear_left_wheel_joint"]
    right_wheel_names: ["front_right_wheel_joint", "rear_right_wheel_joint"]

    # Geometry from agrinav_description: track = chassis width + wheel width.
    wheel_separation: 0.7  # m
    wheel_radius: 0.15     # m
    # Skid steer turns slower than the kinematic model predicts because the
    # wheels scrub sideways; tuned against ground truth in the localization PR.
    wheel_separation_multiplier: 1.0

    odom_frame_id: odom
    base_frame_id: base_footprint
    # Only the EKF publishes odom -> base_footprint.
    enable_odom_tf: false
    publish_rate: 50.0  # Hz
    # Wheel odometry is good in x and yaw rate, poor in y (no lateral sensing).
    pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]
    twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.03]

    cmd_vel_timeout: 0.5  # s without a command before the wheels stop

    linear.x.has_velocity_limits: true
    linear.x.max_velocity: 1.0       # m/s
    linear.x.min_velocity: -1.0      # m/s
    linear.x.has_acceleration_limits: true
    linear.x.max_acceleration: 1.0   # m/s^2
    linear.x.min_acceleration: -1.0  # m/s^2

    angular.z.has_velocity_limits: true
    angular.z.max_velocity: 1.2       # rad/s
    angular.z.min_velocity: -1.2      # rad/s
    angular.z.has_acceleration_limits: true
    angular.z.max_acceleration: 2.0   # rad/s^2
    angular.z.min_acceleration: -2.0  # rad/s^2
