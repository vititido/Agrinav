pointcloud_to_laserscan:
  ros__parameters:
    use_sim_time: true
    target_frame: base_footprint
    transform_tolerance: 0.05  # s allowed for TF lookup
    min_height: 0.35          # m above ground, excludes terrain and chassis
    max_height: 1.0           # m above ground, intersects tree trunks
    angle_min: -3.141592653589793  # rad
    angle_max: 3.141592653589793   # rad
    angle_increment: 0.006981317007977318  # rad, 0.4 degrees as on the 3D lidar
    scan_time: 0.1            # s, lidar runs at 10 Hz
    range_min: 0.5            # m, excludes the robot footprint
    range_max: 30.0           # m, matches lidar maximum range
    use_inf: true
