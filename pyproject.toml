# Repository-wide tool configuration. ROS packages keep their own setup.py;
# this file only configures ruff and pytest.

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "BLE"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
# Each ROS package is its own import root, so ruff cannot infer these.
known-first-party = ["agrinav_*"]

[tool.pytest.ini_options]
testpaths = ["src"]
addopts = "-ra"
